<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logg inn · PRONTO</title>
  <style>body{margin:0;background:#f4f6fa;color:#233851;font:16px system-ui,sans-serif}main{max-width:380px;margin:12vh auto;padding:32px;background:white;border:1px solid #e4e9f0;border-radius:12px}h1{font-size:26px;margin-top:0}label{display:block;margin-bottom:8px}input{box-sizing:border-box;width:100%;font:inherit;padding:12px;border:1px solid #b8c6d6;border-radius:6px}button{font:inherit;width:100%;padding:12px;background:#203b63;color:white;border:0;border-radius:6px;cursor:pointer}[role=alert]{color:#9b2424}input:focus-visible,button:focus-visible{outline:3px solid #2689bc;outline-offset:3px}</style>
</head>
<body>
  <main>
    <h1>PRONTO · Logg inn</h1>
    {% if form.errors %}<p role="alert">Brukernavn eller passord er ikke riktig.</p>{% endif %}
    <form method="post">
      {% csrf_token %}
      <p><label for="id_username">Brukernavn</label> {{ form.username }}</p>
      <p><label for="id_password">Passord</label> {{ form.password }}</p>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit">Logg inn</button>
    </form>
  </main>
</body>
</html>
