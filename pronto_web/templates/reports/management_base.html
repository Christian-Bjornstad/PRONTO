<!doctype html>
<html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Administrasjon{% endblock %} · PRONTO</title><link rel="icon" href="{% url 'pronto-favicon' %}">
<style>body{margin:0;background:#f4f6fa;color:#203b63;font:15px system-ui,sans-serif}main{max-width:1120px;margin:40px auto;padding:24px}h1{font-size:28px}a{color:#176995}nav{display:flex;gap:24px;margin-bottom:28px}.panel{background:white;border:1px solid #dde4ed;border-radius:10px;padding:24px;margin:24px 0}table{min-width:760px;width:100%;border-collapse:collapse}th,td{text-align:left;padding:14px 10px;border-bottom:1px solid #e2e7ee;vertical-align:top}th{font-size:12px;text-transform:uppercase}input,button{font:inherit;border:1px solid #bcc9d8;border-radius:5px;padding:9px;max-width:100%;box-sizing:border-box}button{cursor:pointer;background:#203b63;color:white}input{background:white;color:#172c46}label{display:block;margin-bottom:5px}form p{display:inline-block;vertical-align:top;margin:0 16px 16px 0}form li,.errorlist,.error{color:#a32232}td form{display:inline-flex;gap:6px;margin:3px 4px 3px 0;flex-wrap:wrap}td input{width:170px}small{display:block;color:#627087;margin-top:5px}.table-wrap{overflow:auto}.muted{color:#627087}.new-user-form{display:flex;flex-wrap:wrap;gap:16px}.new-user-form p{margin:0}.new-user-form button{align-self:flex-start;margin-top:24px}@media(max-width:680px){.new-user-form{display:block}.new-user-form p{display:block;margin-bottom:16px}.new-user-form button{margin-top:0}}:focus-visible{outline:3px solid #21738c;outline-offset:3px}</style></head>
<body><main><nav><a href="{% url 'report-index' %}">Rapporter</a><a href="{% url 'manage-users' %}">Brukere</a><span>{{ request.user.username }}</span></nav>{% block content %}{% endblock %}</main></body></html>
