<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rapporter · PRONTO</title>
</head>
<body>
  <main>
    <h1>Rapporter</h1>
    {% if reports %}
      <ul>{% for report in reports %}<li><a href="{% url 'report-detail' report.report_id %}">{{ report.report_id }}</a></li>{% endfor %}</ul>
    {% else %}
      <p>Ingen rapporter er tilgjengelige for denne brukeren.</p>
    {% endif %}
    <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Logg ut</button></form>
  </main>
</body>
</html>
