<section class="report-panel" role="tabpanel" id="panel-key-findings" aria-labelledby="tab-key-findings">
  <h2 class="visually-hidden">Nøkkelfunn</h2>
  <div class="metrics-grid">{{ biomarker_cards }}</div>
  <dl class="patient-strip">{{ case_facts }}</dl>
  <div class="key-variants">
    <div class="section-heading">
      <div>
        <p class="section-heading__eyebrow">Kildedata</p>
        <h2>Varianter med oppgitt proteinendring</h2>
      </div>
      <p class="section-heading__description">Kun oppføringer med proteinendring i validert kildedata. Rapporteringsbeslutninger gjøres i Variantgjennomgang.</p>
    </div>
    <div class="table-scroll" role="region" aria-label="Varianter med oppgitt proteinendring" tabindex="0">
      <table id="key-variant-table">
        <thead><tr><th scope="col">Gen</th><th scope="col">Proteinendring</th><th scope="col">AF tumor (0–1)</th></tr></thead>
        <tbody>{{ key_variant_rows }}</tbody>
      </table>
    </div>
  </div>
</section>
