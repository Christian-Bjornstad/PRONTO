<section class="report-panel" role="tabpanel" id="panel-variant-review" aria-labelledby="tab-variant-review" hidden>
  <div class="section-heading">
    <div>
      <p class="section-heading__eyebrow">Arbeidsflate</p>
      <h2>Variantgjennomgang</h2>
    </div>
    <p class="section-heading__description">Søk, sorter og dokumenter rapporteringsbeslutninger.</p>
  </div>
  <div class="table-toolbar">
    <label for="variant-search">Søk i varianter</label>
    <input id="variant-search" type="search" autocomplete="off" placeholder="Gen, lokasjon eller endring">
    <p id="variant-count" role="status" aria-live="polite">{{ variant_count }} varianter</p>
  </div>
  <div class="table-scroll" role="region" aria-label="Varianttabell" tabindex="0">
    <table id="variant-table">
      <thead><tr>
        <th scope="col"><button type="button" data-sort="gene" aria-label="Sorter etter gen">Gen</button></th>
        <th scope="col">Genomisk lokasjon</th>
        <th scope="col">DNA-endring</th>
        <th scope="col">Protein</th>
        <th scope="col"><button type="button" data-sort="vaf" aria-label="Sorter etter variantallelfrekvens">VAF</button></th>
        <th scope="col">Kildetier</th>
        <th scope="col">Forekomst-ID</th>
      </tr></thead>
      <tbody>{{ variant_rows }}</tbody>
    </table>
  </div>
  <p id="variant-no-match" class="empty-state" hidden>Ingen varianter matcher søket.</p>
</section>
