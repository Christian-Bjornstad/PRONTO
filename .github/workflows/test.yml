name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Install PDF plot tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          pdfinfo -v
          pdftoppm -v
      - name: Set up Python 3.14.0
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.0'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-test.txt
      - name: Run unit tests
        run: python -m pytest -q
      - name: Run Django request tests
        run: python manage.py test pronto_web.reports

  desktop-test:
    name: Desktop import and local server
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Install PDF and headless Qt tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils libegl1 libopengl0
      - name: Set up Python 3.14.0
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.0'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
            requirements-desktop.txt
            requirements-desktop-test.txt
      - name: Install desktop and test dependencies
        run: python -m pip install -r requirements-desktop-test.txt
      - name: Verify five-folder import and native control window
        run: python -m pytest pronto/tests/ingest pronto/tests/desktop -q

  full-test:
    name: Docker fixture tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Build test image
        run: docker build -t pronto:full-test .
      - name: Run OUS fixture
        run: >-
          docker run --rm
          -v "${{ github.workspace }}/test_data/ous:/data/sample_data/analysis_results"
          -v "${{ github.workspace }}/test_data/ous/251114_A02134_0115_BHCJCKDRX7_TSO_500_LocalApp_postprocessing_results/InPreD_PRONTO_metadata.txt:/pronto/In/InPreD_PRONTO_metadata.txt"
          pronto:full-test /pronto/Script/PRONTO.py
      - name: Run HUS fixture
        run: >-
          docker run --rm
          -v "${{ github.workspace }}/test_data/hus:/data/sample_data/analysis_results"
          -v "${{ github.workspace }}/test_data/InPreD_PRONTO_metadata.txt:/pronto/In/InPreD_PRONTO_metadata.txt"
          pronto:full-test /pronto/Script/PRONTO.py
